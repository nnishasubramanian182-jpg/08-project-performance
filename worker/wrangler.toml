name = "08-project-upload"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[r2_buckets]]
binding = "USERLIST_BUCKET"
bucket_name = "08-project-userlist-db"

[vars]
GITHUB_OWNER = "nnishasubramanian182-jpg"
GITHUB_REPO = "08-project-performance"
R2_S3_ENDPOINT = "https://3451f4be4d15af5f219f114ac79fd890.r2.cloudflarestorage.com"
R2_BUCKET_NAME = "08-project-userlist-db"

[triggers]
# GitHub Actions' own `schedule:` trigger is unreliable -- Cloudflare Cron
# Triggers dispatch the same workflows via the GitHub API instead, same
# pattern as the reference project (04-project-performance).
# Sweep only rescues orphaned MANUAL uploads (web-form ingests dropped by a
# GitHub Actions concurrency race) -- it has no effect on master DB
# freshness, which comes entirely from the hourly pull. So it runs just
# once/day (offset 30min from the pull) instead of every 20min.
crons = ["0 * * * *", "30 0 * * *"]
