name: Bonus classification audit (one-off diagnostic)

on:
  workflow_dispatch: {}
  # TEMPORARY one-off trigger: the GitHub Actions "Run workflow" UI button
  # is not rendering for this repo, and no available credential has write
  # access to dispatch via the REST API either. `push` needs neither --
  # revert/remove this workflow right after the one-time run it's here for.
  push:
    branches: [main]
    paths: ["bonus_classification_audit.py"]

concurrency:
  group: db-ingest
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Audit bonus classification
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 bonus_classification_audit.py
