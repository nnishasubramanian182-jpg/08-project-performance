name: Backfill date range (deposits/withdrawals/wallet)

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date, YYYY-MM-DD (inclusive)"
        required: true
      to_date:
        description: "End date, YYYY-MM-DD (inclusive)"
        required: true
  # TEMPORARY one-off trigger: the GitHub Actions "Run workflow" UI button
  # is not rendering for this repo, and no available credential has write
  # access to dispatch via the REST API either. `push` needs neither --
  # revert this block right after the one-time run it's here for.
  push:
    branches: [main]
    paths: ["backfill_range.py"]

concurrency:
  group: db-ingest
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Backfill range
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 backfill_range.py --from-date "${{ inputs.from_date || '2026-09-01' }}" --to-date "${{ inputs.to_date || '2026-09-15' }}"

      - name: Refresh deposit report
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 build_deposit_report.py
